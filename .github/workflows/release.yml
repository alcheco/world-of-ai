# Publica WoAI: al subir un tag vX.Y.Z compila los instaladores y los deja en
# un Release *borrador* de GitHub, junto con latest.json para el actualizador.
#   node scripts/bump.mjs 0.2.0 && git commit -am "v0.2.0" && git tag v0.2.0 && git push --follow-tags
# Revisa el borrador y publícalo: desde ese momento las apps instaladas lo ven.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset: nombre de los archivos subidos al Release ("" = el de Tauri). En macOS se usa el chip
          # en vez de aarch64/x64 para que se entienda cuál descargar.
          - os: macos-latest
            args: --bundles app,dmg
            asset: '[name]_[version]_AppleSilicon[ext]'
          - os: macos-15-intel
            args: --bundles app,dmg
            asset: '[name]_[version]_Intel[ext]'
          - os: windows-latest
            args: --bundles nsis
            asset: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Companion (tests)
        working-directory: companion
        run: |
          npm ci
          npm test

      - name: App (dependencias)
        working-directory: app
        run: npm ci

      # Firma y notarización de Apple (opcional). Un secreto que no existe llega como "" y Tauri
      # intenta importarlo como .p12 y falla, así que solo se exportan los que tienen valor.
      # El .p12 se importa aquí (no en Tauri) junto con los intermedios de Apple, para que codesign
      # vea una identidad válida; a Tauri se le pasa su hash en vez del nombre.
      - name: Firma de Apple (si hay secretos)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Sin APPLE_CERTIFICATE: la app se firma ad-hoc y va sin notarizar."
            exit 0
          fi
          set -euo pipefail
          KC="$RUNNER_TEMP/woai-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDCA DeveloperIDG2CA AppleWWDRCAG3; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KC" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          echo "Identidades en el llavero de firma:"
          security find-identity -p codesigning "$KC"
          HASH="$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$HASH" ]; then
            echo "::error::El .p12 no trae una identidad Developer ID Application válida. Si arriba sale '0 identities', se exportó sin la clave privada: expórtalo desde 'Mis certificados' en Acceso a Llaveros."
            exit 1
          fi
          echo "Firmando con $HASH"

          {
            echo "APPLE_SIGNING_IDENTITY=$HASH"
            for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then echo "$v<<__EOF__"; printf '%s\n' "${!v}"; echo "__EOF__"; fi
            done
          } >> "$GITHUB_ENV"

      # beforeBuildCommand compila el sidecar del companion con Node SEA y copia el addon.
      - uses: tauri-apps/tauri-action@v0
        env:
          # Con CI=true el .dmg se arma sin la disposición de Finder (fondo, flecha, enlace a Aplicaciones).
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Las variables APPLE_* llegan por $GITHUB_ENV desde el paso anterior.
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: WoAI ${{ github.ref_name }}
          releaseBody: |
            **macOS:** descarga `WoAI_…_AppleSilicon.dmg` (chip M1 o posterior) o `WoAI_…_Intel.dmg`, ábrelo y arrastra WoAI a Aplicaciones.
            **Windows:** descarga y ejecuta `WoAI_…_x64-setup.exe`.
            Si ya tienes WoAI, se actualiza solo.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.asset }}
