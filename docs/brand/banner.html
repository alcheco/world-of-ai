<!doctype html>
<meta charset="utf-8">
<title>WoAI banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@700&family=Alegreya+Sans:wght@500&display=block">
<style>
/* Banner del README: 1280×400, exportar con export-banner.sh (2x). Misma cabecera que design-system.html. */
html,body{margin:0;background:#07090d}
.banner{position:relative;width:1280px;height:400px;overflow:hidden;box-sizing:border-box;
  background:radial-gradient(ellipse 55% 75% at 50% 42%,#14294a 0%,#0b1626 45%,#07090d 100%);
  border:2px solid #6b5226;outline:3px solid #000;outline-offset:-5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.banner::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,74,.28);pointer-events:none}
.lockup{display:flex;align-items:center;gap:26px}
.lockup img{width:178px;height:178px}
.wordmark{display:flex;flex-direction:column;align-items:center;gap:8px}
.wm{font:900 132px/1 "Cinzel Decorative",serif;letter-spacing:.01em;
  padding:.32em .18em .26em;margin:-.32em -.18em -.26em;
  background:linear-gradient(180deg,#fff7d1 0%,#ffe27a 30%,#e0a823 55%,#a8701a 75%,#f5cf62 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #4a2e06;
  filter:drop-shadow(0 2px 0 #3a2405) drop-shadow(0 0 1px #000) drop-shadow(0 6px 10px rgba(0,0,0,.8))}
.wm .o{font-size:.72em;background:inherit;-webkit-background-clip:text;background-clip:text}
.ribbon{font:700 15px/1 "Cinzel",serif;letter-spacing:.32em;text-transform:uppercase;color:#ffd100;
  background:linear-gradient(180deg,#8a1c1c,#4d0d0d);padding:10px 38px;border-block:1px solid #c9a24a;
  clip-path:polygon(0 0,100% 0,calc(100% - 15px) 50%,100% 100%,0 100%,15px 50%)}
.tag{font:500 21px/1.3 "Alegreya Sans",sans-serif;color:#b8c2d0;letter-spacing:.01em}
.tag b{color:#8fd3ff;font-weight:500}
.palette{position:absolute;left:0;right:0;bottom:0;height:6px;display:flex}
.palette i{flex:1}
</style>
<div class="banner">
  <div class="lockup">
    <img src="emblem.svg" alt="">
    <div class="wordmark">
      <div class="wm">W<span class="o">o</span>AI</div>
      <div class="ribbon">Get work done!</div>
    </div>
  </div>
  <div class="palette">
    <i style="background:#8fd3ff"></i><i style="background:#ffd100"></i><i style="background:#c9a24a"></i>
    <i style="background:#6b5226"></i><i style="background:#6e1616"></i><i style="background:#2e4261"></i>
    <i style="background:#33ff99"></i><i style="background:#bfe6bf"></i>
  </div>
</div>
